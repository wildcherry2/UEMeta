[General]
intermediate_directory = "D:\intermediate"
mode = Unreal

[Git Target]
url = git@github.com:EpicGames/UnrealEngine.git
branches =
    5.5

[Parser]
parser_path = "../parser/out"
parser_additional_commands = "-f json --prefer-full-name-in-file-name"

[Unreal Parser]
use_existing_project = true
public_dependency_module_names =
    Core
    CoreUObject
    Engine
headers =
    CoreMinimal.h
    UObject/Object.h
    Engine.h
    GameFramework/GameMode.h
platform = Win64
config = Shipping