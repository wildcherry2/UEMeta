[General]
intermediate_directory = "D:\intermediate"
mode = Unreal

[Git Target]
url = git@github.com:EpicGames/UnrealEngine.git
branches =
    5.5

[Parser]
parser_path = "../parser/out"
parser_additional_commands =
    -f
    json
    --builtin-subpaths
    Windows Kits
    VC\\Tools\\MSVC

[Unreal Parser]
# this is a debug option; it should generally be false since files can sometimes be cleared, leading to incomplete results
use_existing_project = false
public_dependency_module_names =
    Core
    CoreUObject
    Engine
headers =
    CoreMinimal.h
    UObject/Object.h
    Engine.h
    GameFramework/GameMode.h
platform = Win64
config = Shipping