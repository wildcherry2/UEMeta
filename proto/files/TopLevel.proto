syntax = "proto3";

package ParserTypes;

import "Enums.proto";
import "VersionedPrimitives.proto";

// Top-level record declaration (class/struct/union).
// If it's semantically anonymous, then its parts will bleed into the containing record rather than be serialized as an unidentifiable record,
// similar to semantically anonymous enums getting split into static variables/fields.
message TLRecordDeclaration {
  DeclarationMetadata metadata = 1;
  RecordKind kind = 2;
  optional TemplateDetails template_details = 3;
  // if set, then the record has all methods defined in this class are inlined in the header.
  // this does not imply anything about parent classes though; inherited method definitions may not be defined in their header.
  // this is useful to know since if a record is header only and doesn't change, then it can be simply copied completely, and
  // if it has changed then you at least know that this class can be completely defined in the header.
  VersionedBool is_complete_definition = 4;
  // May be missing if the size is unknown (e.g. templates).
  VersionedInt64 size_bytes = 5;
  // May be missing if the alignment is unknown (e.g. templates).
  VersionedInt64 align_bytes = 6;
  // fields are added in order
  repeated Field fields = 7;
  // hashes of records, enums, and static fields that are 
  // nested within this record. this is not recursive; just direct nested declarations
  optional VersionedHashList nested_hashes = 8;
  repeated BaseSpecifier bases = 9;
  repeated MemberFunction methods = 10;
}

// Top-level enum declaration.
message TLEnumDeclaration {
  DeclarationMetadata metadata = 1;

  // int, unsigned, long, etc.
  // if missing, the underlying type is implementation defined (usually the smallest primitive that can hold all values for unscoped, or int for scoped).
  VersionedString underlying_type = 2;

  // enum class/struct, if missing then the enum is unscoped.
  optional EnumScope scope = 3;

  repeated Enumerator enumerators = 4;
}

// An independently tracked top-level free-function declaration.
message TLFreeFunctionDeclaration {
  DeclarationMetadata metadata = 1;
  FunctionCommon common = 2;
}

// An independently tracked global-variable declaration.
message TLGlobalVariableDeclaration {
  DeclarationMetadata metadata = 1;
  optional TemplateDetails template_details = 2;
  // note that this is only 'versioned' if the variable doesn't have a template
  // that's because without a template, the variable must follow the ODR, so its type doesn't contribute to its identity.
  // so version A could have a variable with type 'int' and version B could have the same variable 'uint64_t', but they're both resolvable through the same qualfied name
  // in each version. 
  // investigate: is auto desugared to the underlying type?
  VersionedTypeRefOrAnon type_ref = 3;
  VersionedVariableStorageClass storage_class = 4;
  VersionedString default_value = 5;
  VersionedConstantEvaluationKind constant_evaluation_kind = 6;
  optional bool is_anon_enum_value = 7;
}

message DeclarationMetadata {
  // The index of this declaration relative to the other declarations
  VersionedUint64 occurrence_index = 1;
  optional bool is_anonymous = 2;
  // name might be missing if it's a special declaration or if it's anonymous
  // note special handling for operators, especially conversion operators: 
  //  namespace A { struct Result; }
  //  namespace B { struct Source { operator A::Result(); }; }
  //  is serialized as ::B::Source::operator ::A::Result
  optional string qualified_name = 3;
  VersionedString file_path = 4;
  VersionedString documentation = 5;

  // ID formed from the hash of the fully qualified name and equivalent of the forward declaration of this declaration without parameter names or parameter default values
  // (template or function). Effectively, the hash of a platform independent mangled name.
  // Identifies a unique type across all versions. TypeRefs may reference this type_id.
  // May be missing if the declaration is anonymous
  optional Hash decl_id = 6;
}

// Shared by record, function, variable, alias, and forward-declaration
// templates. specialization_kind == NONE identifies a primary (unspecialized) template.
message TemplateDetails {
  // params should always be added in order of appearance
  repeated TemplateParameter parameters = 1;
  TemplateSpecializationKind specialization_kind = 2;

  // if this is a specialization, this is the type_id of the primary template that this is a specialization of.
  // if this is an instantiation, this is the type_id of the specialization or primary template that this is an instantiation of.
  optional TypeRef primary_template_decl_id = 3;
}

// Represents a single template parameter.
// Ex: With `template<typename T, int N = 5> struct A...`, `typename T` and `int N` are each Template parameters.
//      With `typename T`, kind = TEMPLATE_PARAMETER_KIND_TYPENAME, identifier.name = "T", and the detail fields are empty.
//      With `int N = 5`, kind = TEMPLATE_PARAMETER_KIND_NON_TYPE, identifier.name = "N", type = "int", and default_value = "5".
// Because template parameters can themselves be templates, the `parameters` field allows for representing template template parameters. 
message TemplateParameter {
  TemplateParameterKind kind = 1;

  // name of the parameter, like "T" in `template<typename T>` or "N" in `template<int N = 5>`
  VersionedString name = 2;

  // when kind == TEMPLATE_PARAMETER_KIND_NON_TYPE, this is the type of the parameter
  optional TypeRef type = 3;
  optional bool is_parameter_pack = 4;

  // when kind == TEMPLATE_PARAMETER_KIND_NON_TYPE, this is the raw default value, if given
  optional VersionedString default_value = 5; // potential weak point: this is a string, but it could implicate types that don't match `type` through polymorphic behavior

  // when kind != TEMPLATE_PARAMETER_KIND_NON_TYPE, this is the default type, if given
  optional VersionedTypeRef default_type = 6;

  repeated TemplateParameter parameters = 7;
}

// A function owned by a TLRecordDeclaration, including constructors,
// destructors, and static member functions. Unlike TLFreeFunctionDeclaration, a
// member function is not independently tracked, so it has no occurrence_index.
message MemberFunction {
  FunctionCommon common = 1;
  VersionedAccessSpecifier access = 2;
  VersionedBool is_const = 3;
  VersionedBool is_volatile = 4;
  VersionedFunctionVirtualityKind virtuality = 5;
  VersionedBool is_deleted = 6;
  VersionedUint64 vtable_index = 7;
  VersionedInt64 vtable_offset = 8;

  // the name of the member function; append to the owning record's FQN to get the FQN of this function
  // note the special handling for operators, documented in DeclarationMetadata.qualified_name
  string name = 9;

  // unique ID for this function, formed from the hash of the FQN, template param 'typename' and concrete types, and parameter types
  // effectively, the hash of a platform independent mangled name + template data.
  // This is not in FunctionCommon because global functions have this in their DeclarationMetadata
  Hash func_id = 10;
}

// Common function traits. Some things may seem like they're better off in MemberFunction,
// like `FunctionDefinitionKind` or `is_explicit`, but it simplifies the processing this way
message FunctionCommon {
  FunctionKind kind = 1;
  optional VersionedTypeRef return_type = 2; // assume 'auto' if not given and not ctor/dtor; note that inline functions can have an anonymous deduced return type, but that's not accounted for currently
  VersionedFunctionStorageClass storage_class = 3;
  VersionedConstantEvaluationKind consteval_kind = 4;
  optional VersionedBool is_explicit = 5; // only settable for ctors and conversion ops
  optional VersionedBool is_friend = 6;
  optional VersionedString inline_definition = 7;
  optional TemplateDetails template_details = 8;
  repeated Parameter parameters = 9;
  optional FunctionDefinitionKind definition_kind = 10; // only set for functions that are deletable/defaultable
}

message Parameter {
  VersionedString name = 1;
  TypeRef type_ref = 2;
  VersionedString default_value = 3;
}

message Enumerator {
  string name = 1;
  VersionedString documentation = 2;
  VersionedString value = 3;
}

// A data member owned by a TLRecordDeclaration.
message Field {
  string name = 1;
  VersionedString documentation = 2;
  VersionedAccessSpecifier access = 3;
  VersionedBool is_mutable = 4;
  VersionedBool is_bitfield = 5;

  // if is_bitfield, then this is the bit width, otherwise this is the size of the field in the layout (same thing, really)
  // may be missing for non-bitfields if there's no layout (primary template)
  VersionedUint64 bit_width = 6;

  // may also be missing if there's no layout
  VersionedUint64 offset_bits = 7;
  VersionedString default_value = 8;
  VersionedTypeRefOrAnon type_ref = 9;
  VersionedConstantEvaluationKind constant_evaluation_kind = 10;
  VersionedVariableStorageClass storage_class = 11;
  optional bool is_anon_enum_value = 12;
}

message BaseSpecifier {
  VersionedAccessSpecifier access = 1;
  VersionedBool is_virtual = 2;
  VersionedUint64 offset = 3;
  TypeRef type_ref = 4;
}

message TypeRef {
  // type as declared, with qualifiers attached (including cvref, pointers, arrays, and namespace resolution)
  VersionedString type_name = 1; //todo maybe make this nonversioned

  oneof id {
    // identifier for the type; points to a serialized TL* type
    Hash decl_id = 2;

    // if the type derives froma forward declaration, this is the occurrence index of that forward declaration
    uint64 forward_decl_index = 3;

    // if the type is std:: or platform-specific, this is the #include that defines the type
    string header = 4;

    // if the type is a builtin, template, or template dependent type, this is set to true
    // if this is false and everything else is missing, then the type is likely unknown
    bool is_builtin_or_template = 5;
  }
}

message TypeRefOrAnon {
  oneof value {
    TypeRef type_ref = 1;
    TLRecordDeclaration anon_record = 2;
    TLEnumDeclaration anon_enum = 3;
  }
}

// general 'versioned' logic: if the field is part of the hashed string in the decl_id, it shouldn't be versioned,
// otherwise it should be versioned

// two versions of a TypeRef are the same if they have the same type_id; their type_name 
// can still differ between versions, which is accounted for by the fact that type_name is versioned
message VersionedTypeRef {
  message VersionItem {
    repeated string source_versions = 1;
    TypeRef value = 2;
  }
  repeated VersionItem versions = 1;
}

// two versions of a TypeRefOrAnon are the same if they have the same value type (TypeRef, TLRecordDeclartion, or TLEnumDeclaration).
// however, those value types can differ between versions, so just because they have the same value type doesn't mean that they're
// the same throughout those types. so if two versions 'A' and 'B' use an anonymous class with different methods, and then a single VersionItem with source_versions = ['A', 'B']
// and value = TLRecordDeclaration is added, but that TLRecordDeclaration will have versioned entries for the methods. This effectively means that the max size of
// versions is the number of types in the type union of VersionedTypeRef.versions
message VersionedTypeRefOrAnon {
  message VersionItem {
    repeated string source_versions = 1;
    TypeRefOrAnon value = 2;
  }
  repeated VersionItem versions = 1;
}

message ForwardDeclarationList {
  message OccurrenceList {
    repeated uint64 occurrence_indices = 1;
    Hash type_id = 2;
  }

  repeated OccurrenceList forward_declarations = 1;
}

message Hash {
  fixed64 a = 1;
  fixed64 b = 2;
}

message VersionedHashList {
  message VersionItem {
    repeated string source_versions = 1;
    repeated Hash value = 2;
  }

  repeated VersionItem versions = 1;
}

// Any top level item
message TLItem {
  oneof value {
    TLRecordDeclaration record = 1;
    TLEnumDeclaration enum_declaration = 2;
    TLFreeFunctionDeclaration function = 3;
    TLGlobalVariableDeclaration variable = 4;
  }
}

message TLItemList {
  repeated TLItem items = 1;
}
