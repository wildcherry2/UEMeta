syntax = "proto3";

package ParserTypes;

import "Enums.proto";
import "VersionedPrimitives.proto";

// Used directly for the .file payload emitted by declaration splitting.
message TLFileData {
    string path = 1;
    uint64 path_hash = 2;
    VersionedUint32 file_occurrence = 3;
    // these are the qualified name hashes of the types defined by this file, excluding forward declarations.
    // you could use this to reconstruct the necessary includes for a file, rather than transitively including all headers
    VersionedUint64List defined_type_hashes = 4;

    // these are the qualified name hashes of the forward declarations in this file. they're excluded from the defined_types because
    // they don't have a definition in this file, but they may be necessary if a file that includes this file depends on it
    VersionedUint64List forward_declaration_hashes = 5;

    // these are the full paths to 'builtin' includes that this file uses. Includes are considered builtin by the parser
    // depending on the CLI arguments; these includes are consistent and always available, so they aren't tracked (like std/STL)
    VersionedStringList builtin_includes = 6;
}

// Top-level record declaration (class/struct/union).
message TLRecordDeclaration {
    DeclarationMetadata metadata = 1;
    RecordKind kind = 2;
    optional TemplateDetails template_details = 3;
    // if set, then the record has all methods defined in this class are inlined in the header.
    // this does not imply anything about parent classes though; inherited method definitions may not be defined in their header.
    // this is useful to know since if a record is header only and doesn't change, then it can be simply copied completely, and
    // if it has changed then you at least know that this class can be completely defined in the header.
    optional VersionedBool is_complete_definition = 4;
    // May be missing if the size is unknown (e.g. templates).
    optional VersionedInt64 size_bytes = 5;
    // May be missing if the alignment is unknown (e.g. templates).
    optional VersionedInt64 align_bytes = 6;
    repeated Field fields = 7;
    // hashes of records, enums, forward decls, static fields, and aliases that are 
    // nested within this record. this is not recursive; just direct nested declarations
    VersionedUint64List nested_hashes = 8;
    repeated BaseSpecifier bases = 9;
    repeated MemberFunction methods = 11;
}

// Top-level enum declaration.
message TLEnumDeclaration {
    DeclarationMetadata metadata = 1;
    EnumDetails details = 2;
    repeated Enumerator enumerators = 3;
}

// Top-level forward declaration.
message TLForwardDeclaration {
    DeclarationMetadata metadata = 1;
    ForwardDeclarationKind kind = 2;
    optional TemplateDetails template_details = 3;
    // Populated only when kind is FORWARD_DECLARATION_KIND_ENUM.
    optional EnumDetails enum_details = 4;
    VersionedString as_string = 5;
}

// Top-level alias declaration, including typedefs and using declarations.
message TLAliasDeclaration {
    DeclarationMetadata metadata = 1;
    optional TemplateDetails template_details = 2;
    TypeInfo aliased_type = 3;
    VersionedString alias = 4;
    VersionedString as_string = 5;
}

// An independently tracked top-level free-function declaration.
message TLFreeFunctionDeclaration {
    DeclarationMetadata metadata = 1;
    FunctionCommon common = 2;
}

// An independently tracked global-variable or static field declaration.
message TLGlobalVariableDeclaration {
    DeclarationMetadata metadata = 1;
    optional TemplateDetails template_details = 2;
    TypeInfo type_info = 3;
    VersionedString as_string = 5;
    optional VersionedVariableStorageClass storage_class = 6;
    optional VersionedString default_value = 7;
    optional VersionedConstantEvaluationKind constant_evaluation_kind = 8;
    VersionedUint64 content_hash = 9;
}

// Identity and source context shared by declarations and their named child
// entities.
// Producers must generate deterministic names for constructs that are unnamed in
// source. A parameter's qualified_name includes its owning function's qualified
// name and a parameter-specific suffix.
message Identifier {
    string name = 1;
    string qualified_name = 2;
    uint64 qualified_name_hash = 3;
    VersionedString file_path = 4;
    VersionedUint64 file_path_hash = 5;
    repeated string scope = 6;
    optional VersionedString documentation = 7;
}

// Identity, source, and file-splitting metadata shared by independently tracked
// Declaration variants, including declarations nested in records. content_hash
// is kept here rather than in Identifier because it changes when the
// declaration changes.
message DeclarationMetadata {
    Identifier identifier = 1;
    VersionedUint64 content_hash = 2;
    // The index of this declaration relative to the other declarations in the same file
    VersionedUint32 occurrence_index = 3;
    optional bool is_anonymous = 4;
}

// Shared by record, function, variable, alias, and forward-declaration
// templates. specialization_kind == NONE identifies a primary (unspecialized) template.
message TemplateDetails {
    repeated TemplateParameter parameters = 1;
    optional TemplateSpecializationKind specialization_kind = 2;
    optional string primary_template_qualified_name = 3;
    repeated string arguments = 4;
}

// Represents a single template parameter.
// Ex: With `template<typename T, int N = 5> struct A...`, `typename T` and `int N` are each Template parameters.
//      With `typename T`, kind = TEMPLATE_PARAMETER_KIND_TYPENAME, identifier.name = "T", and the detail fields are empty.
//      With `int N = 5`, kind = TEMPLATE_PARAMETER_KIND_NON_TYPE, identifier.name = "N", type = "int", and default_value = "5".
// Because template parameters can themselves be templates, the `parameters` field allows for representing template template parameters. 
message TemplateParameter {
    TemplateParameterKind kind = 1;
    Identifier identifier = 2;
    optional TypeInfo type = 3;
    optional bool is_parameter_pack = 4;

    // when kind == TEMPLATE_PARAMETER_KIND_NON_TYPE, this is the raw default value, if given
    optional string default_value = 5;

    // when kind != TEMPLATE_PARAMETER_KIND_NON_TYPE, this is the default type, if given
    optional TypeInfo default_type = 6;

    repeated TemplateParameter parameters = 7;
    VersionedString as_string = 8;
}

message EnumDetails {
    // int, unsigned, long, etc.
    // if missing, the underlying type is implementation defined (usually the smallest primitive that can hold all values for unscoped, or int for scoped).
    optional VersionedString underlying_type = 1;

    // enum class/struct, if missing then the enum is unscoped.
    optional EnumScope scope = 2;
}

// A function owned by a TLRecordDeclaration, including constructors,
// destructors, and static member functions. Unlike TLFreeFunctionDeclaration, a
// member function is not independently tracked, so it has no occurrence_index.
message MemberFunction {
    FunctionCommon common = 1;
    VersionedAccessSpecifier access = 2;
    VersionedBool is_const = 3;
    VersionedBool is_volatile = 4;
    VersionedFunctionVirtualityKind virtuality = 5;
    VersionedBool is_deleted = 6;
    optional VTableIndex vtable_index = 8;
}

// Common function traits. Some things may seem like they're better off in MemberFunction,
// like `FunctionDefinitionKind` or `is_explicit`, but it simplifies the processing this way
message FunctionCommon {
    FunctionKind kind = 1;
    optional TypeInfo return_type = 3; // assume 'auto' if not given and not ctor/dtor
    optional VersionedFunctionStorageClass storage_class = 4;
    optional VersionedConstantEvaluationKind consteval_kind = 5;
    optional bool is_explicit = 6; // only set for ctors and conversion ops
    optional VersionedString inline_definition = 7;
    optional TemplateDetails template_details = 9;
    repeated Parameter parameters = 10;
    VersionedString as_string = 11;
    Identifier identifier = 12;
    VersionedUint64 content_hash = 13;
    optional FunctionDefinitionKind definition_kind = 14; // only set for functions that are deletable/defaultable
}

// Parameters use a deterministic synthesized identity when no name is spelled in
// the source.
message Parameter {
    Identifier identifier = 1;
    TypeInfo type_info = 2;
    VersionedString default_value = 3;
    VersionedString as_string = 4;
    VersionedUint64 content_hash = 5;
}

message VTableIndex {
    VersionedUint64 index = 1;
    VersionedInt64 offset = 2;
}

message Enumerator {
    Identifier identifier = 1;
    VersionedString value = 2;
}

// A non-static data member owned by a TLRecordDeclaration.
message Field {
    Identifier identifier = 1;
    VersionedString as_string = 2;
    VersionedAccessSpecifier access = 3;
    VersionedBool is_mutable = 4;
    VersionedBool is_bitfield = 5;

    // if is_bitfield, then this is the bit width, otherwise this is the size of the field in the layout (same thing, really)
    // may be missing for non-bitfields if there's no layout (primary template)
    optional VersionedUint64 bit_width = 6;

    // may also be missing if there's no layout
    optional VersionedUint64 offset_bits = 7;
    VersionedUint64 content_hash = 8;
    optional VersionedString default_value = 9;
    TypeInfo type_info = 10;
}

message BaseSpecifier {
    Identifier identifier = 1;
    AccessSpecifier access = 2;
    optional VersionedBool is_virtual = 3;
    optional VersionedUint64 offset = 4;
    VersionedString as_string = 5;
    TypeInfo type_info = 6;
}

message TypeInfo {
    // type as declared
    VersionedString type = 1;

    // type without any pointers, references, array brackets, or cv qualifiers
    VersionedString underlying_type = 2;

    // whether the type is a template or dependent type (like 'T' in 'template<typename T> void f(T t)' or 'type' in 'typename T::type')
    optional bool is_templated_type = 3;

    // the hash of the source path for this type; may be empty if it's a builtin or templated type
    optional VersionedUint64 source_path_hash = 4;
}

// Any top level item
message TLItem {
    oneof value {
        TLRecordDeclaration record = 1;
        TLEnumDeclaration enum_declaration = 2;
        TLForwardDeclaration forward_declaration = 3;
        TLAliasDeclaration alias = 4;
        TLFreeFunctionDeclaration function = 5;
        TLGlobalVariableDeclaration variable = 6;
        TLFileData file_data = 7;
    }
}

message TLItemList {
    repeated TLItem items = 1;
}